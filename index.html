<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <style>
    body {
      background-color: #C5CAE9;
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      position: fixed;
      width: 100dvw;
    }

    .content {
      height: 100%;
      width: 100%;
    }

    #gui {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(18, 18, 26, 0.90);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      min-width: 280px;
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: 11px;
      color: #ccc;
      z-index: 100;
      user-select: none;
    }

    .gui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }

    #gui-toggle {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.20);
      color: #ccc;
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    #gui-toggle:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    #gui-body {
      padding: 6px 0 10px;
      max-height: calc(100dvh - 60px);
      overflow-y: auto;
    }

    .gui-section-title {
      padding: 8px 12px 2px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: #666;
    }

    .gui-row {
      display: flex;
      align-items: center;
      padding: 3px 12px;
      gap: 6px;
      height: 24px;
    }

    .gui-label {
      flex: 0 0 112px;
      color: #aaa;
      white-space: nowrap;
    }

    .gui-row input[type="range"] {
      flex: 1;
      accent-color: #7986CB;
      cursor: pointer;
      margin: 0;
    }

    .gui-color-preview {
      flex: 1;
      height: 20px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.20);
      transition: border-color 0.15s;
    }

    .gui-color-preview:hover {
      border-color: rgba(255, 255, 255, 0.50);
    }

    .gui-palette {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 12px 6px;
    }

    .gui-palette-row {
      display: flex;
      gap: 2px;
    }

    .gui-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      cursor: pointer;
      box-sizing: border-box;
      border: 1px solid transparent;
    }

    .gui-swatch:hover {
      border-color: rgba(255, 255, 255, 0.70);
    }

    .gui-swatch.selected {
      border-color: #fff;
      outline: 1px solid rgba(0, 0, 0, 0.50);
      outline-offset: 0px;
    }

    .gui-val {
      flex: 0 0 44px;
      text-align: right;
      color: #7986CB;
      font-size: 10px;
    }
  </style>
  <script type="module">
    import * as THREE from './js/lib/three/0.171.0/three.module.min.js';
    import { OutlineEffect } from './js/lib/three/0.171.0/effects/OutlineEffect.js'
    import { GLTFLoader } from './js/lib/three/0.171.0/loaders/GLTFLoader.js';
    import { DRACOLoader } from './js/lib/three/0.171.0/loaders/DRACOLoader.js';
    import { EffectComposer } from './js/lib/three/0.171.0/postprocessing/EffectComposer.js';
    import { RenderPass } from './js/lib/three/0.171.0/postprocessing/RenderPass.js';
    import { ShaderPass } from './js/lib/three/0.171.0/postprocessing/ShaderPass.js';
    import { FXAAShader } from './js/lib/three/0.171.0/shaders/FXAAShader.js';

    const params = {
      backgroundColor:    '#C5CAE9',
      cameraDistance:     2,
      lookAtX:            0,
      lookAtY:            0,
      lookAtZ:            0,
      rotCenterY:         0.5,
      rotRange:           0.2,
      rotStartAngle:      Math.PI,
      ambientIntensity:   4.6,
      dirIntensity:       0.4,
      dirLightX:          5,
      dirLightY:          10,
      dirLightZ:          5,
    };

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = params.cameraDistance;

    const cameraGroup = new THREE.Group();
    cameraGroup.add(camera);
    scene.add(cameraGroup);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector('.content'),
      alpha: true,
    });

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const effect = new OutlineEffect(renderer, {
      defaultThickness: 0.003,
      defaultColor: [0x3E/0xff, 0x27/0xff, 0x23/0xff],
      defaultAlpha: 1.0,
      defaultKeepAlive: true,
    });

    // XXX: delegate function
    effect.getRenderTarget = renderer.getRenderTarget.bind(renderer);

    const ambientLight = new THREE.AmbientLight(0xffffff, params.ambientIntensity);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, params.dirIntensity);
    directionalLight.position.set(params.dirLightX, params.dirLightY, params.dirLightZ);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    const material = new THREE.MeshToonMaterial({
      vertexColors: false,
    });

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('./js/lib/three/0.171.0/libs/draco/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    let loaded = false;

    const objects = {
    };

    function onFrame(timestamp, deltaTime) {
      cameraGroup.position.y = params.rotCenterY + params.rotRange * Math.sin(Math.PI * timestamp / 2400 + params.rotStartAngle);
      cameraGroup.rotation.y += Math.PI/48;
      camera.lookAt(params.lookAtX, params.lookAtY, params.lookAtZ);

      if (mixer) {
        mixer.update(deltaTime / 1000);
      }
      composer.render();
    }

    let mixer;
    let actions = {};

    loader.load('./001.glb', function (gltf) {
      const model = gltf.scene;

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          const action = mixer.clipAction(clip);
          actions[clip.name] = action;
        });
        actions['Action'].play();
      }

      model.traverse(function (child) {
        if (child.name in objects) {
          objects[child.name] = child;
        }
        if (child.isMesh) {
          if (child.geometry) {
            child.geometry.computeVertexNormals();
            if (child.geometry.morphAttributes.position) {
              if (!child.geometry.morphAttributes.normal) {
                const morphPositions = child.geometry.morphAttributes.position;
                const morphNormals = [];
                for (let i = 0; i < morphPositions.length; i++) {
                  const morphGeometry = child.geometry.clone();
                  morphGeometry.setAttribute('position', morphPositions[i]);
                  morphGeometry.computeVertexNormals();
                  morphNormals.push(morphGeometry.attributes.normal);
                }
                child.geometry.morphAttributes.normal = morphNormals;
              }
            }
          }
          const oldMat = child.material;

          child.material = new THREE.MeshToonMaterial({
            map: oldMat.map ?? null,
            color: oldMat.color ?? 0xffffff,
          });
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      scene.add(model);

      lastTime = performance.now();
      loaded = true;
    }, undefined, function (error) {
      console.error(error);
    });

    const composer = new EffectComposer(effect);

    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const fxaaPass = new ShaderPass(FXAAShader);
    composer.addPass(fxaaPass);

    // XXX: prevent black screen at loading
    composer.render();

    const fps = 24;
    const interval = 1000 / fps;
    let lastTime = 0;

    function animate(timestamp) {
      const deltaTime = timestamp - lastTime;
      if (loaded && deltaTime >= interval) {
        lastTime = timestamp;
        onFrame(timestamp, deltaTime);
      }
      requestAnimationFrame(animate);
    }

    function onResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      renderer.setPixelRatio(window.devicePixelRatio >= 2 ? 2 : 1);
      renderer.setSize(width, height, false);

      composer.setPixelRatio(window.devicePixelRatio >= 2 ? 2 : 1);
      composer.setSize(width, height);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      fxaaPass.material.uniforms['resolution'].value.x = 1 / (width * window.devicePixelRatio * 2);
      fxaaPass.material.uniforms['resolution'].value.y = 1 / (height * window.devicePixelRatio * 2);
    }

    let timeout = 0;
    onResize();
    window.addEventListener('resize', () => {
      clearTimeout(timeout);
      timeout = setTimeout(onResize, 100);
    });

    animate(performance.now());

    // --- GUI ---

    const guiToggle = document.getElementById('gui-toggle');
    const guiBody = document.getElementById('gui-body');

    guiToggle.addEventListener('click', () => {
      const collapsed = guiBody.style.display === 'none';
      guiBody.style.display = collapsed ? '' : 'none';
      guiToggle.textContent = collapsed ? '−' : '+';
    });

    function addSection(label) {
      const el = document.createElement('div');
      el.className = 'gui-section-title';
      el.textContent = label;
      guiBody.appendChild(el);
    }

    function addPalette(label, key, palette, onChange) {
      const row = document.createElement('div');
      row.className = 'gui-row';

      const lbl = document.createElement('span');
      lbl.className = 'gui-label';
      lbl.textContent = label;

      const preview = document.createElement('div');
      preview.className = 'gui-color-preview';
      preview.style.backgroundColor = params[key];
      preview.title = 'Click to toggle palette';

      const hexVal = document.createElement('span');
      hexVal.className = 'gui-val';
      hexVal.textContent = params[key];

      row.appendChild(lbl);
      row.appendChild(preview);
      row.appendChild(hexVal);
      guiBody.appendChild(row);

      const grid = document.createElement('div');
      grid.className = 'gui-palette';
      grid.style.display = 'none';

      const rowSizes = [...Array(16).fill(14), 10, 10, 10, 2];
      let colorIndex = 0;

      rowSizes.forEach(size => {
        const rowEl = document.createElement('div');
        rowEl.className = 'gui-palette-row';

        for (let i = 0; i < size && colorIndex < palette.length; i++, colorIndex++) {
          const color = palette[colorIndex];
          const swatch = document.createElement('div');
          swatch.className = 'gui-swatch';
          swatch.style.backgroundColor = color;
          swatch.title = color;
          if (color === params[key]) swatch.classList.add('selected');

          swatch.addEventListener('click', () => {
            params[key] = color;
            preview.style.backgroundColor = color;
            hexVal.textContent = color;
            onChange(color);
            grid.querySelectorAll('.gui-swatch.selected').forEach(s => s.classList.remove('selected'));
            swatch.classList.add('selected');
          });

          rowEl.appendChild(swatch);
        }

        grid.appendChild(rowEl);
      });

      preview.addEventListener('click', () => {
        grid.style.display = grid.style.display === 'none' ? '' : 'none';
      });

      guiBody.appendChild(grid);
    }

    function addSlider(label, key, min, max, step, fmt, onChange) {
      const row = document.createElement('div');
      row.className = 'gui-row';

      const lbl = document.createElement('span');
      lbl.className = 'gui-label';
      lbl.textContent = label;

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = min;
      slider.max = max;
      slider.step = step;
      slider.value = params[key];

      const val = document.createElement('span');
      val.className = 'gui-val';
      val.textContent = fmt(params[key]);

      slider.addEventListener('input', () => {
        params[key] = parseFloat(slider.value);
        val.textContent = fmt(params[key]);
        if (onChange) onChange(params[key]);
      });

      row.appendChild(lbl);
      row.appendChild(slider);
      row.appendChild(val);
      guiBody.appendChild(row);
    }

    const f1 = v => v.toFixed(1);
    const f2 = v => v.toFixed(2);
    const fπ = v => (v / Math.PI).toFixed(2) + 'π';

    fetch('./color-palette.json')
      .then(r => r.json())
      .then(palette => {
        addSection('Background');
        addPalette('Color', 'backgroundColor', palette, v => { document.body.style.backgroundColor = v; });

        addSection('Camera');
        addSlider('Distance',  'cameraDistance', 0.5, 10,  0.1,  f1, v => { camera.position.z = v; });
        addSlider('Look At X', 'lookAtX',        -5,  5,   0.1,  f1);
        addSlider('Look At Y', 'lookAtY',        -5,  5,   0.1,  f1);
        addSlider('Look At Z', 'lookAtZ',        -5,  5,   0.1,  f1);

        addSection('Camera Orbit');
        addSlider('Center Y',    'rotCenterY',    -2,         2,          0.01, f2);
        addSlider('Range',       'rotRange',       0,         2,          0.01, f2);
        addSlider('Start Angle', 'rotStartAngle',  0, Math.PI * 2, 0.01, fπ);

        addSection('Ambient Light');
        addSlider('Intensity', 'ambientIntensity', 0, 20, 0.1, f1, v => { ambientLight.intensity = v; });

        addSection('Directional Light');
        addSlider('Intensity',  'dirIntensity', 0,   5,  0.1, f1, v => { directionalLight.intensity = v; });
        addSlider('Position X', 'dirLightX',   -20, 20,  0.5, f1, () => { directionalLight.position.set(params.dirLightX, params.dirLightY, params.dirLightZ); });
        addSlider('Position Y', 'dirLightY',   -20, 20,  0.5, f1, () => { directionalLight.position.set(params.dirLightX, params.dirLightY, params.dirLightZ); });
        addSlider('Position Z', 'dirLightZ',   -20, 20,  0.5, f1, () => { directionalLight.position.set(params.dirLightX, params.dirLightY, params.dirLightZ); });
      });
  </script>
</head>
<body>
  <canvas class="content"></canvas>
  <div id="gui">
    <div class="gui-header">
      <span>Controls</span>
      <button id="gui-toggle">−</button>
    </div>
    <div id="gui-body"></div>
  </div>
</body>
</html>
