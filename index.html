<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <style>
    body {
      height: 100dvh;
      margin: 0;
      overflow: hidden;
      position: fixed;
      width: 100dvw;
    }

    .content {
      height: 100%;
      width: 100%;
    }

    #gui {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(18, 18, 26, 0.90);
      backdrop-filter: blur(12px);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      width: 528px;
      max-width: calc(100dvw - 20px);
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: 11px;
      color: #ccc;
      z-index: 100;
      user-select: none;
    }

    .gui-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
    }

    #gui-toggle {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.20);
      color: #ccc;
      cursor: pointer;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      font-size: 15px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    #gui-toggle:hover {
      background: rgba(255, 255, 255, 0.10);
    }

    #gui-body {
      padding: 6px 0 10px;
      max-height: calc(100dvh - 60px);
      overflow-y: auto;
    }

    .gui-section-title {
      padding: 8px 12px 2px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.10em;
      color: #666;
    }

    .gui-row {
      display: flex;
      align-items: center;
      padding: 3px 12px;
      gap: 6px;
      height: 24px;
    }

    .gui-label {
      flex: 0 0 112px;
      color: #aaa;
      white-space: nowrap;
    }

    .gui-row input[type="range"] {
      flex: 1;
      min-width: 0;
      width: 0;
      accent-color: #7986CB;
      cursor: pointer;
      margin: 0;
    }

    .gui-color-preview {
      flex: 1;
      height: 20px;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.20);
      transition: border-color 0.15s;
    }

    .gui-color-preview:hover {
      border-color: rgba(255, 255, 255, 0.50);
    }

    .gui-palette {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 4px 12px 6px;
    }

    .gui-palette-row {
      display: flex;
      gap: 2px;
    }

    .gui-swatch {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      cursor: pointer;
      box-sizing: border-box;
      border: 1px solid transparent;
    }

    .gui-swatch:hover {
      border-color: rgba(255, 255, 255, 0.70);
    }

    .gui-swatch.selected {
      border-color: #fff;
      outline: 1px solid rgba(0, 0, 0, 0.50);
      outline-offset: 0px;
    }

    .gui-val {
      flex: 0 0 44px;
      text-align: right;
      color: #7986CB;
      font-size: 10px;
    }

    .gui-file-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.20);
      color: #ccc;
      cursor: pointer;
      height: 20px;
      border-radius: 3px;
      font-family: ui-monospace, 'Cascadia Code', monospace;
      font-size: 10px;
      text-align: left;
      padding: 0 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gui-file-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.40);
    }

    body.square-mode {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
  </style>
  <script type="module">
    import * as THREE from './js/lib/three/0.171.0/three.module.min.js';
    import { OutlineEffect } from './js/lib/three/0.171.0/effects/OutlineEffect.js'
    import { GLTFLoader } from './js/lib/three/0.171.0/loaders/GLTFLoader.js';
    import { DRACOLoader } from './js/lib/three/0.171.0/loaders/DRACOLoader.js';
    import { EffectComposer } from './js/lib/three/0.171.0/postprocessing/EffectComposer.js';
    import { RenderPass } from './js/lib/three/0.171.0/postprocessing/RenderPass.js';
    import { ShaderPass } from './js/lib/three/0.171.0/postprocessing/ShaderPass.js';
    import { FXAAShader } from './js/lib/three/0.171.0/shaders/FXAAShader.js';

    const params = {
      backgroundColor:    '#C5CAE9',
      cameraDistance:     2,
      lookAtX:            0,
      lookAtY:            0,
      lookAtZ:            0,
      rotCenterY:         0.5,
      rotRange:           0.2,
      rotStartAngle:      Math.PI,
      ambientIntensity:   4.6,
      dirIntensity:       0.4,
      dirLightX:          5,
      dirLightY:          10,
      dirLightZ:          5,
      fps:                24,
      cycleDuration:      5000,
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color().setStyle(params.backgroundColor, THREE.NoColorSpace);
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = params.cameraDistance;

    const cameraGroup = new THREE.Group();
    cameraGroup.add(camera);
    scene.add(cameraGroup);

    const renderer = new THREE.WebGLRenderer({
      canvas: document.querySelector('.content'),
    });

    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const effect = new OutlineEffect(renderer, {
      defaultThickness: 0.003,
      defaultColor: [0x3E/0xff, 0x27/0xff, 0x23/0xff],
      defaultAlpha: 1.0,
      defaultKeepAlive: true,
    });

    // XXX: delegate function
    effect.getRenderTarget = renderer.getRenderTarget.bind(renderer);

    const ambientLight = new THREE.AmbientLight(0xffffff, params.ambientIntensity);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, params.dirIntensity);
    directionalLight.position.set(params.dirLightX, params.dirLightY, params.dirLightZ);
    directionalLight.castShadow = true;
    scene.add(directionalLight);

    const material = new THREE.MeshToonMaterial({
      vertexColors: false,
    });

    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('./js/lib/three/0.171.0/libs/draco/');

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    // `loaded` gates the render loop and stays true once any model has shown;
    // `modelLoaded` tracks only the latest requested model.
    let loaded = false;
    let modelLoaded = false;
    let loadError = null;
    let latestLoadId = 0;

    const objects = {
    };

    function onFrame(timestamp) {
      cameraGroup.position.y = params.rotCenterY + params.rotRange * Math.sin(Math.PI * timestamp / (params.cycleDuration / 2) + params.rotStartAngle);
      cameraGroup.rotation.y = (Math.PI * 2) * timestamp / params.cycleDuration;
      camera.lookAt(params.lookAtX, params.lookAtY, params.lookAtZ);

      if (mixer) {
        mixer.setTime(timestamp / 1000);
      }
      composer.render();
    }

    let mixer = null;
    let actions = {};
    let currentModel = null;
    let previewMode = false;
    let exportStartFrame = 0;
    let frameSlider;
    let frameVal;
    let previewBtn;
    let displayBtn;
    let squareMode = false;
    let liveTimestamp = 0;

    function disposeModel() {
      if (!currentModel) return;
      scene.remove(currentModel);
      currentModel.traverse(child => {
        if (child.isMesh) {
          child.geometry?.dispose();
          if (Array.isArray(child.material)) {
            child.material.forEach(m => m.dispose());
          } else {
            child.material?.dispose();
          }
        }
      });
      if (mixer) {
        mixer.stopAllAction();
        mixer.uncacheRoot(currentModel);
        mixer = null;
        actions = {};
      }
      currentModel = null;
    }

    function loadModel(url, revokeUrl) {
      const loadId = ++latestLoadId;
      modelLoaded = false;
      loadError = null;

      loader.load(url, function (gltf) {
        if (loadId !== latestLoadId) {
          if (revokeUrl) URL.revokeObjectURL(url);
          return;
        }

        disposeModel();

        const model = gltf.scene;

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            actions[clip.name] = action;
          });
          const firstAction = actions['Action'] || Object.values(actions)[0];
          if (firstAction) firstAction.play();
        }

        model.traverse(function (child) {
          if (child.name in objects) {
            objects[child.name] = child;
          }
          if (child.isMesh) {
            if (child.geometry) {
              child.geometry.computeVertexNormals();
              if (child.geometry.morphAttributes.position) {
                if (!child.geometry.morphAttributes.normal) {
                  const morphPositions = child.geometry.morphAttributes.position;
                  const morphNormals = [];
                  for (let i = 0; i < morphPositions.length; i++) {
                    const morphGeometry = child.geometry.clone();
                    morphGeometry.setAttribute('position', morphPositions[i]);
                    morphGeometry.computeVertexNormals();
                    morphNormals.push(morphGeometry.attributes.normal);
                  }
                  child.geometry.morphAttributes.normal = morphNormals;
                }
              }
            }
            const oldMat = child.material;

            child.material = new THREE.MeshToonMaterial({
              map: oldMat.map ?? null,
              color: oldMat.color ?? 0xffffff,
            });
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        currentModel = model;
        scene.add(model);
        modelLoaded = true;

        if (revokeUrl) URL.revokeObjectURL(url);

        if (!loaded) {
          lastTime = performance.now();
          loaded = true;
        }
      }, undefined, function (error) {
        console.error(error);
        if (revokeUrl) URL.revokeObjectURL(url);
        if (loadId === latestLoadId) loadError = error?.message || String(error);
      });
    }

    loadModel('./001.glb', false);

    const composer = new EffectComposer(effect);

    const renderPass = new RenderPass(scene, camera);
    composer.addPass(renderPass);

    const fxaaPass = new ShaderPass(FXAAShader);
    composer.addPass(fxaaPass);

    // XXX: prevent black screen at loading
    composer.render();

    let lastTime = 0;

    function animate(timestamp) {
      const interval = 1000 / params.fps;
      const deltaTime = timestamp - lastTime;
      if (loaded && deltaTime >= interval) {
        lastTime += interval;
        liveTimestamp = previewMode ? exportStartFrame * interval : timestamp;
        onFrame(liveTimestamp);
      }
      requestAnimationFrame(animate);
    }

    function onResize() {
      let width, height;
      if (squareMode) {
        const size = Math.min(window.innerWidth, window.innerHeight);
        width = size;
        height = size;
        renderer.domElement.style.width = size + 'px';
        renderer.domElement.style.height = size + 'px';
      } else {
        width = window.innerWidth;
        height = window.innerHeight;
        renderer.domElement.style.width = '';
        renderer.domElement.style.height = '';
      }

      renderer.setPixelRatio(window.devicePixelRatio >= 2 ? 2 : 1);
      renderer.setSize(width, height, false);

      composer.setPixelRatio(window.devicePixelRatio >= 2 ? 2 : 1);
      composer.setSize(width, height);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      fxaaPass.material.uniforms['resolution'].value.x = 1 / (width * window.devicePixelRatio * 2);
      fxaaPass.material.uniforms['resolution'].value.y = 1 / (height * window.devicePixelRatio * 2);
    }

    let timeout = 0;
    onResize();
    window.addEventListener('resize', () => {
      clearTimeout(timeout);
      timeout = setTimeout(onResize, 100);
    });

    animate(performance.now());

    function generateExportHTML() {
      const p = params;
      return `<!DOCTYPE html>

    function addExportButton() {
      const row = document.createElement('div');
      row.className = 'gui-row';

      const lbl = document.createElement('span');
      lbl.className = 'gui-label';
      lbl.textContent = 'Export HTML';

      const btn = document.createElement('button');
      btn.className = 'gui-file-btn';
      btn.textContent = 'Download index.html';
      btn.addEventListener('click', () => {
        const html = generateExportHTML();
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        a.click();
        URL.revokeObjectURL(url);
      });

      row.appendChild(lbl);
      row.appendChild(btn);
      guiBody.appendChild(row);
    }

    function updateFrameSliderMax() {
      if (!frameSlider) return;
      const maxFrame = Math.round(params.fps * params.cycleDuration / 1000) - 1;
      frameSlider.max = maxFrame;
      if (exportStartFrame > maxFrame) {
        exportStartFrame = maxFrame;
        frameSlider.value = maxFrame;
        frameVal.textContent = maxFrame;
      }
    }

    function setPreviewMode(enabled) {
      previewMode = enabled;
      previewBtn.textContent = previewMode ? 'On' : 'Off';
    }

    function setSquareMode(enabled) {
      squareMode = enabled;
      displayBtn.textContent = squareMode ? 'Square' : 'Full Page';
      document.body.classList.toggle('square-mode', squareMode);
      onResize();
    }

    function addExportPreview() {
      const frameRow = document.createElement('div');
      frameRow.className = 'gui-row';

      const frameLbl = document.createElement('span');
      frameLbl.className = 'gui-label';
      frameLbl.textContent = 'Start Frame';

      frameSlider = document.createElement('input');
      frameSlider.type = 'range';
      frameSlider.min = 0;
      frameSlider.max = Math.round(params.fps * params.cycleDuration / 1000) - 1;
      frameSlider.step = 1;
      frameSlider.value = exportStartFrame;

      frameVal = document.createElement('span');
      frameVal.className = 'gui-val';
      frameVal.textContent = exportStartFrame;

      frameSlider.addEventListener('input', () => {
        exportStartFrame = parseInt(frameSlider.value);
        frameVal.textContent = exportStartFrame;
      });

      frameRow.appendChild(frameLbl);
      frameRow.appendChild(frameSlider);
      frameRow.appendChild(frameVal);
      guiBody.appendChild(frameRow);

      const previewRow = document.createElement('div');
      previewRow.className = 'gui-row';

      const previewLbl = document.createElement('span');
      previewLbl.className = 'gui-label';
      previewLbl.textContent = 'Preview';

      previewBtn = document.createElement('button');
      previewBtn.className = 'gui-file-btn';
      previewBtn.textContent = 'Off';
      previewBtn.addEventListener('click', () => setPreviewMode(!previewMode));

      previewRow.appendChild(previewLbl);
      previewRow.appendChild(previewBtn);
      guiBody.appendChild(previewRow);
    }

    function addViewToggle() {
      const row = document.createElement('div');
      row.className = 'gui-row';

      const lbl = document.createElement('span');
      lbl.className = 'gui-label';
      lbl.textContent = 'Display';

      displayBtn = document.createElement('button');
      displayBtn.className = 'gui-file-btn';
      displayBtn.textContent = 'Full Page';
      displayBtn.addEventListener('click', () => setSquareMode(!squareMode));

      row.appendChild(lbl);
      row.appendChild(displayBtn);
      guiBody.appendChild(row);
    }

    // --- GUI ---

    const guiToggle = document.getElementById('gui-toggle');
    const guiBody = document.getElementById('gui-body');
    const guiHeader = guiToggle.closest('.gui-header');

    // Per-param callbacks that redraw a control from params; filled in as controls are built
    const guiSync = {};

    guiHeader.addEventListener('click', () => {
      const collapsed = guiBody.style.display === 'none';
      guiBody.style.display = collapsed ? '' : 'none';
      guiToggle.textContent = collapsed ? '−' : '+';
    });

    function addSection(label) {
      const el = document.createElement('div');
      el.className = 'gui-section-title';
      el.textContent = label;
      guiBody.appendChild(el);
    }

    function addPalette(label, key, palette, onChange) {
      const row = document.createElement('div');
      row.className = 'gui-row';

      const lbl = document.createElement('span');
      lbl.className = 'gui-label';
      lbl.textContent = label;

      const preview = document.createElement('div');
      preview.className = 'gui-color-preview';
      preview.style.backgroundColor = params[key];
      preview.title = 'Click to toggle palette';

      const hexVal = document.createElement('span');
      hexVal.className = 'gui-val';
      hexVal.textContent = params[key];

      row.appendChild(lbl);
      row.appendChild(preview);
      row.appendChild(hexVal);
      guiBody.appendChild(row);

      const grid = document.createElement('div');
      grid.className = 'gui-palette';
      grid.style.display = 'none';

      const rowSizes = [...Array(16).fill(14), 10, 10, 10, 2];
      let colorIndex = 0;

      rowSizes.forEach(size => {
        const rowEl = document.createElement('div');
        rowEl.className = 'gui-palette-row';

        for (let i = 0; i < size && colorIndex < palette.length; i++, colorIndex++) {
          const color = palette[colorIndex];
          const swatch = document.createElement('div');
          swatch.className = 'gui-swatch';
          swatch.style.backgroundColor = color;
          swatch.title = color;
          if (color === params[key]) swatch.classList.add('selected');

          swatch.addEventListener('click', () => {
            params[key] = color;
            guiSync[key]();
            onChange(color);
          });

          rowEl.appendChild(swatch);
        }

        grid.appendChild(rowEl);
      });

      preview.addEventListener('click', () => {
        grid.style.display = grid.style.display === 'none' ? '' : 'none';
      });

      guiBody.appendChild(grid);

      guiSync[key] = () => {
        preview.style.backgroundColor = params[key];
        hexVal.textContent = params[key];
        grid.querySelectorAll('.gui-swatch').forEach(s => s.classList.toggle('selected', s.title === params[key]));
      };
    }

    function addSlider(label, key) {
      const { min, max, step, fmt, onChange } = sliderDefs[key];

      const row = document.createElement('div');
      row.className = 'gui-row';

      const lbl = document.createElement('span');
      lbl.className = 'gui-label';
      lbl.textContent = label;

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = min;
      slider.max = max;
      slider.step = step;
      slider.value = params[key];

      const val = document.createElement('span');
      val.className = 'gui-val';
      val.textContent = fmt(params[key]);

      slider.addEventListener('input', () => {
        params[key] = parseFloat(slider.value);
        val.textContent = fmt(params[key]);
        if (onChange) onChange(params[key]);
      });

      row.appendChild(lbl);
      row.appendChild(slider);
      row.appendChild(val);
      guiBody.appendChild(row);

      guiSync[key] = () => {
        slider.value = params[key];
        val.textContent = fmt(params[key]);
      };
    }

    const f1 = v => v.toFixed(1);
    const f2 = v => v.toFixed(2);
    const fπ = v => (v / Math.PI).toFixed(2) + 'π';

    const updateDirLightPosition = () => { directionalLight.position.set(params.dirLightX, params.dirLightY, params.dirLightZ); };

    // Declared up front so setState can apply slider limits before the sliders exist
    const sliderDefs = {
      cameraDistance:   { min: 0.5,  max: 6,           step: 0.05,           fmt: f2, onChange: v => { camera.position.z = v; } },
      lookAtX:          { min: -1.5, max: 1.5,         step: 0.01,           fmt: f2 },
      lookAtY:          { min: -1.5, max: 1.5,         step: 0.01,           fmt: f2 },
      lookAtZ:          { min: -1.5, max: 1.5,         step: 0.01,           fmt: f2 },
      rotCenterY:       { min: -2,   max: 3,           step: 0.1,            fmt: f1 },
      rotRange:         { min: 0,    max: 3,           step: 0.1,            fmt: f1 },
      rotStartAngle:    { min: 0,    max: Math.PI * 2, step: Math.PI * 0.05, fmt: fπ },
      fps:              { min: 1,    max: 60,          step: 1,              fmt: v => String(Math.round(v)), onChange: updateFrameSliderMax },
      cycleDuration:    { min: 500,  max: 10000,       step: 100,            fmt: v => Math.round(v) + ' ms', onChange: updateFrameSliderMax },
      ambientIntensity: { min: 0,    max: 30,          step: 0.1,            fmt: f1, onChange: v => { ambientLight.intensity = v; } },
      dirIntensity:     { min: 0,    max: 3,           step: 0.1,            fmt: f1, onChange: v => { directionalLight.intensity = v; } },
      dirLightX:        { min: -20,  max: 20,          step: 0.5,            fmt: f1, onChange: updateDirLightPosition },
      dirLightY:        { min: -20,  max: 20,          step: 0.5,            fmt: f1, onChange: updateDirLightPosition },
      dirLightZ:        { min: -20,  max: 20,          step: 0.5,            fmt: f1, onChange: updateDirLightPosition },
    };

    const applyBackgroundColor = v => { scene.background.setStyle(v, THREE.NoColorSpace); };

    function addFileLoader() {
      const row = document.createElement('div');
      row.className = 'gui-row';

      const lbl = document.createElement('span');
      lbl.className = 'gui-label';
      lbl.textContent = 'Load GLB';

      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.glb,.gltf';
      fileInput.style.display = 'none';

      const btn = document.createElement('button');
      btn.className = 'gui-file-btn';
      btn.textContent = 'Choose file…';
      btn.addEventListener('click', () => fileInput.click());

      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        btn.textContent = file.name;
        fileInput.value = '';
        loadModel(URL.createObjectURL(file), true);
      });

      row.appendChild(lbl);
      row.appendChild(btn);
      row.appendChild(fileInput);
      guiBody.appendChild(row);
    }

    addSection('Model');
    addFileLoader();
    addExportButton();
    addExportPreview();

    addSection('View');
    addViewToggle();

    let guiReady = false;

    fetch('./color-palette.json')
      .then(r => r.json())
      .then(palette => {
        addSection('Background');
        addPalette('Color', 'backgroundColor', palette, applyBackgroundColor);

        addSection('Camera');
        addSlider('Distance',  'cameraDistance');
        addSlider('Look At X', 'lookAtX');
        addSlider('Look At Y', 'lookAtY');
        addSlider('Look At Z', 'lookAtZ');

        addSection('Camera Orbit');
        addSlider('Center Y',    'rotCenterY');
        addSlider('Range',       'rotRange');
        addSlider('Start Angle', 'rotStartAngle');
        addSlider('FPS',         'fps');
        addSlider('Cycle',       'cycleDuration');

        addSection('Ambient Light');
        addSlider('Intensity', 'ambientIntensity');

        addSection('Directional Light');
        addSlider('Intensity',  'dirIntensity');
        addSlider('Position X', 'dirLightX');
        addSlider('Position Y', 'dirLightY');
        addSlider('Position Z', 'dirLightZ');

        guiReady = true;
      });

    // --- Automation API ---

    function validateStateValue(key, value) {
      if (key === 'backgroundColor') {
        if (typeof value !== 'string' || !/^#[0-9a-f]{6}$/i.test(value)) {
          throw new TypeError(`backgroundColor must be a #RRGGBB string, got ${value}`);
        }
        return value.toUpperCase();
      }
      if (key === 'preview' || key === 'square') {
        if (typeof value !== 'boolean') throw new TypeError(`${key} must be a boolean, got ${value}`);
        return value;
      }
      if (key === 'startFrame' || Object.hasOwn(sliderDefs, key)) {
        if (!Number.isFinite(value)) throw new TypeError(`${key} must be a finite number, got ${value}`);
        return value;
      }
      throw new TypeError(`Unknown state key: ${key}`);
    }

    // Clamps and rounds exactly as a slider with these limits would
    function snapToSlider(value, { min, max, step }) {
      const probe = document.createElement('input');
      probe.type = 'range';
      probe.min = min;
      probe.max = max;
      probe.step = step;
      probe.value = value;
      return parseFloat(probe.value);
    }

    window.orbitune = {
      isReady: () => guiReady,

      isLoaded: () => modelLoaded,

      getLoadError: () => loadError,

      getState: () => ({
        ...params,
        startFrame: exportStartFrame,
        preview: previewMode,
        square: squareMode,
      }),

      setState(partial) {
        // Validate everything first so a bad value leaves the state untouched
        const state = {};
        for (const [key, value] of Object.entries(partial)) {
          state[key] = validateStateValue(key, value);
        }

        const sliderKeys = Object.keys(state).filter(key => Object.hasOwn(sliderDefs, key));
        for (const key of sliderKeys) {
          // Unchanged values skip the slider, whose rounding would alter the default rotStartAngle
          if (state[key] !== params[key]) params[key] = snapToSlider(state[key], sliderDefs[key]);
        }
        // Run after all params are set: the Start Frame limit depends on fps and cycleDuration together
        for (const key of sliderKeys) {
          sliderDefs[key].onChange?.(params[key]);
          guiSync[key]?.();
        }

        if (state.backgroundColor !== undefined) {
          params.backgroundColor = state.backgroundColor;
          applyBackgroundColor(state.backgroundColor);
          guiSync.backgroundColor?.();
        }
        if (state.startFrame !== undefined) {
          frameSlider.value = state.startFrame;
          exportStartFrame = parseInt(frameSlider.value);
          frameVal.textContent = exportStartFrame;
        }
        if (state.preview !== undefined) {
          setPreviewMode(state.preview);
        }
        if (state.square !== undefined && state.square !== squareMode) {
          setSquareMode(state.square);
        }
      },

      getModelBounds() {
        if (!currentModel) return null;
        // Precise: includes the current morph and skinning pose, not just the rest geometry
        const box = new THREE.Box3().setFromObject(currentModel, true);
        if (box.isEmpty()) return null;
        return {
          min: { x: box.min.x, y: box.min.y, z: box.min.z },
          max: { x: box.max.x, y: box.max.y, z: box.max.z },
        };
      },

      renderFrame(frameIndex, size) {
        if (!Number.isFinite(frameIndex)) throw new TypeError(`frameIndex must be a finite number, got ${frameIndex}`);
        if (!Number.isInteger(size) || size <= 0) throw new RangeError(`size must be a positive integer, got ${size}`);

        // Renders through the live pipeline at export settings, then restores it in the
        // same task, so the browser never presents the intermediate canvas contents.
        try {
          renderer.setPixelRatio(1);
          renderer.setSize(size, size, false);
          composer.setPixelRatio(1);
          composer.setSize(size, size);
          camera.aspect = 1;
          camera.updateProjectionMatrix();
          fxaaPass.material.uniforms['resolution'].value.x = 1 / (size * 2);
          fxaaPass.material.uniforms['resolution'].value.y = 1 / (size * 2);

          onFrame(frameIndex * (1000 / params.fps));
          return renderer.domElement.toDataURL('image/png');
        } finally {
          onResize();
          onFrame(liveTimestamp);
        }
      },
    };
  </script>
</head>
<body>
  <canvas class="content"></canvas>
  <div id="gui">
    <div class="gui-header">
      <span>Controls</span>
      <button id="gui-toggle">−</button>
    </div>
    <div id="gui-body"></div>
  </div>
</body>
</html>
